<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brand Name | Contact</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>

<body>
  <!-- ================= HEADER ================= -->
  <header class="topbar" role="banner">
    <div class="topbar-inner">
      <a class="brand" href="index.html" aria-label="Home">
        <div class="logo" aria-hidden="true">
          <div class="logo-mark">LOGO</div>
        </div>
      </a>

      <button class="nav-toggle" type="button"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="primaryNav">
        <span></span><span></span><span></span>
      </button>

      <nav id="primaryNav" class="nav" aria-label="Primary">
        <a href="index.html" class="navlink">Home</a>
        <a href="about.html" class="navlink">About</a>
        <a href="reviews.html" class="navlink">Reviews</a>
        <a href="gallery.html" class="navlink">Gallery</a>
        <a href="resume.html" class="navlink">Resume</a>
      </nav>
    </div>
  </header>

  <!-- ================= MAIN ================= -->
  <main>
    <section class="feature" aria-label="Contact">
      <div class="wrap">
        <div class="card section-card">

          <div class="contact-layout">
            <!-- LEFT IMAGE -->
            <div class="contact-image" role="img" aria-label="Contact image placeholder">
              <img
                src="assets/images/GZHeadshot.jpg"
                alt="Contact image"
                class="contact-img"
                loading="lazy"
              />
            </div>

            <!-- RIGHT CONTENT -->
            <div class="contact-content">
              <p class="eyebrow">CONTACT CARD</p>

              <p class="feature-body">
                Feel free to reach out to me for any professional or personal inquiries
              </p>

              <!-- “Fake form” with text rows -->
              <div class="fake-form" aria-label="Contact details placeholders">
                <div class="fake-row two-col">
                  

                <div class="fake-row">
                  <div class="fake-field">
                    <div class="fake-label"></div>
                    <div class="fake-line"></div>
                    <div class="fake-value">Gregg</div>
                  </div>
                </div>

                <div class="fake-row">
                  <div class="fake-field">
                    <div class="fake-label"></div>
                    <div class="fake-line"></div>
                    <div class="fake-value">Zeringue</div>
                  </div>
                </div>

                <div class="fake-row">
                  <div class="fake-field">
                    <div class="fake-label">Email</div>
                    <div class="fake-line"></div>
                    <div class="fake-value">greggzeringue@gmail.com</div>
                  </div>
                </div>

                <div class="fake-row">
                  <div class="fake-field">
                    <div class="fake-label">Mobile Number</div>
                    <div class="fake-line"></div>
                    <div class="fake-value">+1 (333)-884-7255</div>
                  </div>
                </div>

              </div>
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- ================= FOOTER ================= -->
    <footer class="footer" role="contentinfo">
      <div class="wrap footer-inner">
        <div class="footer-left">
          <div class="footer-brand">GREGG ZERINGUE</div>
          <div class="footer-muted">greggzeringue@gmail.com • +1(333)-884-7255</div>
        </div>
        <div class="footer-right">
          <a href="#"></a>
          <a href="#"></a>
          <a href="contact.html">Contact</a>
        </div>
      </div>
    </footer>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
